[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "p4net"
version = "0.0.0"
description = "A P4Runtime-native SDN simulation framework for BMv2."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "The p4net Authors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Networking",
  "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
  "pyroute2>=0.7.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "pytest-mock",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/p4net"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/p4net"]

[[tool.mypy.overrides]]
module = ["pyroute2", "pyroute2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "integration: requires root and Linux network namespaces",
]
