[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "p4net"
version = "1.0.0"
description = "A P4Runtime-native SDN simulation framework for BMv2."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "The p4net Authors" }]
maintainers = [{ name = "Henghua Zhang", email = "1652709417@qq.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Networking",
  "Development Status :: 5 - Production/Stable",
]
dependencies = [
  "pyroute2>=0.7.12",
  "grpcio>=1.60",
  "protobuf>=5.0",
  "p4runtime>=1.5",
  "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "pytest-mock",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "mkdocs-static-i18n>=1.2",
  "pymdown-extensions>=10.7",
  "pillow>=10.0",
  "cairosvg>=2.7",
]

[project.urls]
Homepage = "https://github.com/zhh2001/p4net"
Repository = "https://github.com/zhh2001/p4net"
Issues = "https://github.com/zhh2001/p4net/issues"
Changelog = "https://github.com/zhh2001/p4net/blob/main/CHANGELOG.md"

[project.scripts]
p4net = "p4net.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/p4net"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/p4net"]

[[tool.mypy.overrides]]
module = ["pyroute2", "pyroute2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "grpc", "grpc.*",
  "google.protobuf", "google.protobuf.*",
  "google.rpc", "google.rpc.*",
  "p4", "p4.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "integration: requires root and Linux network namespaces",
  "requires_p4c: requires the 'p4c' compiler binary on PATH",
  "requires_bmv2: requires the simple_switch_grpc binary on PATH",
]
