name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      has_packages: ${{ steps.packages.outputs.has_packages }}
    steps:
      - name: Download and verify release packages
        id: packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag in the form vX.Y.Z." >&2
            exit 1
          fi

          published_tag="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft --jq 'select(.isDraft == false) | .tagName')"
          if [[ "$published_tag" != "$RELEASE_TAG" ]]; then
            echo "Publish GitHub Release $RELEASE_TAG before uploading its packages." >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          wheel="p4net-$version-py3-none-any.whl"
          sdist="p4net-$version.tar.gz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern "$wheel" --pattern "$sdist" --pattern SHA256SUMS

          python3 - "$version" "$wheel" "$sdist" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen

          version, *packages = sys.argv[1:]
          assets = Path("release-assets")
          checksums = {}
          for line in (assets / "SHA256SUMS").read_text().splitlines():
              fields = line.split()
              if len(fields) != 2 or not re.fullmatch(r"[a-f0-9]{64}", fields[0]):
                  sys.exit("Invalid SHA-256 entry in SHA256SUMS.")
              digest, filename = fields
              filename = filename.removeprefix("./")
              if filename not in packages or filename in checksums:
                  sys.exit(f"Unexpected or duplicate SHA-256 entry for {filename!r}.")
              checksums[filename] = digest

          for filename in packages:
              with (assets / filename).open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              if checksums.get(filename) != digest:
                  sys.exit(f"SHA-256 verification failed for {filename}.")
              print(f"Verified {filename}.")

          try:
              with urlopen(f"https://pypi.org/pypi/p4net/{version}/json", timeout=30) as response:
                  published = {file["filename"]: file["digests"]["sha256"] for file in json.load(response)["urls"]}
          except HTTPError as error:
              if error.code != 404:
                  raise
              published = {}

          if not published.items() <= checksums.items():
              sys.exit(f"Published PyPI files for {version} differ from the GitHub Release.")
          pending = [filename for filename in packages if filename not in published]
          if pending:
              directory = Path("dist")
              directory.mkdir()
              for filename in pending:
                  (assets / filename).rename(directory / filename)
          else:
              print(f"PyPI already contains both verified packages for {version}.")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"has_packages={str(bool(pending)).lower()}", file=output)
          PY

      - name: Upload verified packages for publishing
        if: steps.packages.outputs.has_packages == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: prepare
    if: needs.prepare.outputs.has_packages == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/p4net/
    permissions:
      id-token: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-distributions
          path: dist/

      - name: Publish to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
