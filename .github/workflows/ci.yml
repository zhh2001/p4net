name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src/p4net

      - name: Pytest
        run: pytest

  wheel-smoke:
    runs-on: ubuntu-24.04
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distributions
        run: |
          printf '%s\n' 'Archive selection check' > local-build-note.txt
          python -m build

      - name: Verify source distribution contents
        run: |
          python - <<'PY'
          import subprocess
          import tarfile
          from pathlib import Path

          tracked = set(subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0"))
          tracked.discard("")
          (sdist,) = Path("dist").glob("*.tar.gz")
          with tarfile.open(sdist) as archive:
              (root,) = {name.split("/")[0] for name in archive.getnames()}
              included = {
                  str(Path(member.name).relative_to(root))
                  for member in archive.getmembers()
                  if member.isfile()
              }
              assert not (missing := tracked - included), f"Missing project files: {sorted(missing)}"
              unexpected = included - tracked - {"PKG-INFO"}
              assert not unexpected, f"Unexpected files: {sorted(unexpected)}"
              for name in tracked:
                  content = archive.extractfile(f"{root}/{name}")
                  assert content is not None, name
                  assert content.read() == Path(name).read_bytes(), name
          print(f"Verified {len(tracked)} project files in {sdist.name}")
          PY

      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/p4net-smoke
          /tmp/p4net-smoke/bin/pip install --upgrade pip
          /tmp/p4net-smoke/bin/pip install dist/p4net-*.whl

      - name: Verify import and console script
        run: |
          /tmp/p4net-smoke/bin/python -c "import p4net; assert p4net.__version__"
          /tmp/p4net-smoke/bin/p4net --help

  integration-test:
    runs-on: ubuntu-24.04
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Run integration tests as root
        run: sudo "$(which pytest)" -m integration --run-integration
