name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src/p4net

      - name: Pytest
        run: pytest

  wheel-smoke:
    runs-on: ubuntu-24.04
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distributions
        run: |
          printf '%s\n' 'Archive selection check' > local-build-note.txt
          python -m build

      - name: Verify source distribution contents
        run: |
          python - <<'PY'
          import subprocess
          import tarfile
          from pathlib import Path

          tracked = set(subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0"))
          tracked.discard("")
          (sdist,) = Path("dist").glob("*.tar.gz")
          with tarfile.open(sdist) as archive:
              (root,) = {name.split("/")[0] for name in archive.getnames()}
              included = {
                  str(Path(member.name).relative_to(root))
                  for member in archive.getmembers()
                  if member.isfile()
              }
              assert not (missing := tracked - included), f"Missing project files: {sorted(missing)}"
              unexpected = included - tracked - {"PKG-INFO"}
              assert not unexpected, f"Unexpected files: {sorted(unexpected)}"
              for name in tracked:
                  content = archive.extractfile(f"{root}/{name}")
                  assert content is not None, name
                  assert content.read() == Path(name).read_bytes(), name
          print(f"Verified {len(tracked)} project files in {sdist.name}")
          PY

      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/p4net-smoke
          /tmp/p4net-smoke/bin/pip install --upgrade pip
          /tmp/p4net-smoke/bin/pip install dist/p4net-*.whl

      - name: Verify import and console script
        run: |
          /tmp/p4net-smoke/bin/python -c "import p4net; assert p4net.__version__"
          /tmp/p4net-smoke/bin/p4net --help

  integration-test:
    runs-on: ubuntu-24.04
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Run integration tests as root
        run: sudo "$(which pytest)" -m integration --run-integration

  p4-toolchain-smoke:
    runs-on: ubuntu-24.04
    env:
      P4_APT_PACKAGES: iproute2 iputils-ping procps p4lang-p4c p4lang-bmv2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve P4 toolchain packages
        id: p4-apt
        run: |
          p4lang_repo=https://download.opensuse.org/repositories/home:/p4lang/xUbuntu_24.04
          curl -fsSL --retry 3 "$p4lang_repo/Release.key" -o "$RUNNER_TEMP/p4lang.asc"
          sudo install -D -m 0644 "$RUNNER_TEMP/p4lang.asc" /etc/apt/keyrings/p4lang.asc
          printf 'deb [signed-by=/etc/apt/keyrings/p4lang.asc] %s/ /\n' "$p4lang_repo" \
            | sudo tee /etc/apt/sources.list.d/p4lang.list >/dev/null
          time sudo apt-get -o Acquire::Retries=3 update

          archives="$RUNNER_TEMP/p4-apt-cache"
          manifest="$RUNNER_TEMP/p4-apt.sha256"
          mkdir -p "$archives"
          read -r -a packages <<< "$P4_APT_PACKAGES"
          apt-get -qq -o Dir::Cache::archives="$archives" -o Acquire::ForceHash=sha256 \
            --print-uris --yes --no-install-recommends install "${packages[@]}" | awk '
              $4 !~ /^SHA256:[0-9a-f]+$/ || length($4) != 71 {
                print "Missing SHA-256 in APT download plan: " $0 > "/dev/stderr"
                exit 1
              }
              { print substr($4, 8) "  " $2 }
            ' | LC_ALL=C sort > "$manifest"
          manifest_hash=$(sha256sum "$manifest")
          printf 'manifest=%s\n' "${manifest_hash%% *}" >> "$GITHUB_OUTPUT"

      - name: Cache APT package archives
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/p4-apt-cache/*.deb
          key: p4-apt-ubuntu-24.04-${{ runner.arch }}-${{ steps.p4-apt.outputs.manifest }}
          restore-keys: p4-apt-ubuntu-24.04-${{ runner.arch }}-

      - name: Install prebuilt P4 toolchain
        run: |
          cd "$RUNNER_TEMP/p4-apt-cache"
          declare -A checksums=()
          while read -r checksum archive; do
            checksums[$archive]=$checksum
          done < "$RUNNER_TEMP/p4-apt.sha256"

          # APT can reuse an existing archive based on its size alone.
          shopt -s nullglob
          for archive in *.deb; do
            if [[ -z "${checksums[$archive]:-}" ]] ||
              ! sha256sum --check --quiet <<< "${checksums[$archive]}  $archive"; then
              rm -- "$archive"
            fi
          done

          read -r -a packages <<< "$P4_APT_PACKAGES"
          time sudo apt-get -o Dir::Cache::archives="$PWD" -o Acquire::Retries=3 \
            -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends "${packages[@]}"
          sudo p4c --version
          sudo simple_switch_grpc --version

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Verify all six directions in the async example
        run: |
          report="$RUNNER_TEMP/p4-toolchain-smoke.xml"
          time sudo "$(command -v python)" -m pytest -v \
            --run-integration --run-p4c --run-bmv2 --junitxml="$report" \
            tests/control/test_async_client_integration.py::test_async_concurrent_example_connects_all_hosts
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse(sys.argv[1]).findall(".//testcase")
          if len(cases) != 1 or any(
              cases[0].find(status) is not None for status in ("skipped", "failure", "error")
          ):
              raise SystemExit("The P4 toolchain smoke test must run and pass.")
          PY
